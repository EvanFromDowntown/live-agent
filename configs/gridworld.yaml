# GridWorld demo configuration.
# Everything here is HUMAN-defined and treated as immutable by the agent at
# runtime: root goals, reward weights, safety constraints, body schema, limits.

agent:
  name: gridworld-explorer
  db_path: gridworld.db

runtime:
  max_ticks: 60          # stop after 60 ticks (0 = run forever)
  tick_timeout: 15s      # per-tick deadline
  tick_interval: 0s      # no sleep between ticks for the demo
  step_mode: false

llm:
  provider: fake         # "fake" (offline, no key) or "openai"
  model: gpt-4o-mini     # used only when provider=openai (or LLM_MODEL)
  temperature: 0.2
  max_tokens: 512
  timeout: 30s
  max_retries: 1

# Reward weights scalarise the multi-dimensional RewardVector. Agent cannot edit.
reward:
  weights:
    task_success: 3.0
    homeostasis: 1.0
    information_gain: 0.5
    human_feedback: 1.0
    resource_cost: 0.5
    risk_cost: 2.0

# Hard safety constraints ALWAYS override reward.
safety:
  constraints:
    - name: no-self-destruct
      type: forbidden_action
      action: self_destruct
      reason: "self-destruction is never permitted"

# Principle/skill activation thresholds.
evolution:
  min_evidence: 2
  min_confidence: 0.6
  min_success_rate: 0.0

# Human-defined ROOT goals. The agent only selects among these; it cannot add or
# modify them.
goals:
  - id: explore_world
    description: "Explore as much of the unknown map as possible."
    priority: 1.0
    tags: [explore, exploration_task]
  - id: stay_alive
    description: "Recover energy and stay healthy."
    priority: 0.8
    tags: [recover, survive, energy_low]

# Body schema: fields are declared here, NOT hard-coded in Go.
body:
  fields:
    - {name: energy, initial: 100, min: 0, max: 100}
    - {name: health, initial: 100, min: 0, max: 100}
    - {name: age, initial: 0, min: 0, max: 100000}

environment:
  type: gridworld
  params:
    width: 6
    height: 6
    num_resources: 5
    num_obstacles: 3
    seed: 42
    init_energy: 100
    max_energy: 100
    init_health: 100
    max_health: 100
    move_cost: 8
    explore_cost: 14
    observe_cost: 1
    rest_gain: 22
    collect_gain: 45
    episode_length: 12
    explore_goal: 0.6
