# Web/Code agent: the agent accomplishes a real task by WRITING and RUNNING
# Python/shell inside a sandboxed Docker container (network enabled, host FS
# isolated to a single scratch workspace). Drive it with a real LLM.
#
# Secrets from env only: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL (or `source .env.local`).

agent:
  name: code-crawler-live
  db_path: webagent-live.db

runtime:
  max_ticks: 8
  tick_timeout: 240s       # each tick = goal call + plan call (reasoning) + container run
  tick_interval: 0s
  step_mode: false

llm:
  provider: openai
  model: ""
  temperature: 0.2
  max_tokens: 4096         # room for reasoning + a full program (prompt is kept lean)
  timeout: 120s
  max_retries: 1
  # This GLM gateway corrupts content under response_format=json_object (it strips
  # the substring "json" from string values, breaking generated code). Ask for
  # JSON via the prompt instead and rely on lenient parsing.
  disable_response_format: true
  # Reasoning-heavy tasks can spend the whole token budget on hidden reasoning and
  # return empty content; disable thinking so the model always emits a plan/code.
  disable_thinking: true

reward:
  weights:
    task_success: 5.0
    homeostasis: 0.5
    information_gain: 1.5
    human_feedback: 1.0
    resource_cost: 0.3
    risk_cost: 1.5

# Hard safety constraints (always override reward).
safety:
  constraints:
    - name: no-self-destruct
      type: forbidden_action
      action: self_destruct
      reason: "never permitted"
    - name: no-run-without-budget
      type: body_min
      field: budget
      value: 1
      applies_to: run_python
      reason: "out of run budget; must stop running code"
    - name: no-shell-without-budget
      type: body_min
      field: budget
      value: 1
      applies_to: run_shell
      reason: "out of run budget; must stop running code"

evolution:
  min_evidence: 2
  min_confidence: 0.6
  min_success_rate: 0.0

# Human-defined root goals. Descriptions double as strategy guidance to the LLM.
goals:
  - id: accomplish_task
    description: >-
      Accomplish the task by writing and running code. Inspect `world.last_stdout`
      and `world.last_stderr` from the previous run, then emit a `run_python`
      action whose `code` fetches the target, parses the needed data, and writes
      the result file. Prefer the Python standard library. When the success file
      already has enough records, use `finish`.
    priority: 1.0
    tags: [task, code, crawl]

  - id: fix_errors
    description: >-
      The previous run failed (non-zero exit or an error in last_stderr). Read the
      error carefully and emit a corrected, SELF-CONTAINED `run_python` action that
      both fetches/parses AND writes the result file in one script. Do NOT merely
      write_file (that does not execute anything) and do not repeat the same
      failing code.
    priority: 0.95
    tags: [debug, error, code]

# Body schema: the "budget" is how many code runs remain this episode.
body:
  fields:
    - {name: budget, initial: 8, min: 0, max: 8}
    - {name: steps, initial: 0, min: 0, max: 1000}

environment:
  type: webagent
  params:
    # ---- task definition ----
    task: >-
      Crawl https://quotes.toscrape.com : fetch the first page, extract every
      quote's text and its author, and save them as a JSON array of objects
      {"text":..., "author":...} to results.json in the current working
      directory. Use only the Python standard library (urllib + html.parser or
      re). Succeeds when results.json contains at least 10 records.
    start_url: https://quotes.toscrape.com
    success_file: results.json
    success_min: 10
    max_steps: 6
    budget: 8
    # ---- sandbox ----
    image: python:3.12-slim
    network: all             # all domains allowed, as requested
    memory_mb: 512
    cpus: 1
    timeout_sec: 40
    workspace: sandbox_workspace
